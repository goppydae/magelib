# Shared golangci-lint configuration for the goppydae ecosystem.
# Consumed by every repo's Lint target via magelib.SharedLintConfig().
#
# The linter set is pinned by name (go manifesto section 12): the standard
# correctness set plus sloglint. Carve-outs are rule-level and documented
# here -- never per-line //nolint directives.
#
# sloglint enforces the manifesto section 8 logging style: slog with
# attribute arguments only (typed constructors from each repo's
# internal/logattr), never loose key-value pairs. The DIV-003 logging
# divergences are resolved; any sloglint finding is a real style break.
version: "2"

linters:
  default: none
  settings:
    sloglint:
      # LogAttrs + typed attribute constructors; loose "key", value
      # pairs are a compile-time-invisible failure mode (manifesto s8).
      attr-only: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - sloglint
    - ineffassign
    - unused
  exclusions:
    paths:
      # Generated gopy/cgo binding output (gapi). Generated code is exempt
      # from hand-written-code rules (go manifesto); gopy's header lacks the
      # canonical "Code generated ... DO NOT EDIT." line, so golangci does
      # not auto-exempt it. This excludes LINT findings only - compile
      # (typecheck) failures in the package still surface via mage test.
      #
      # LOCAL RUNS ONLY (MAGELIB-DIV-009). This path is gitignored in gapi
      # and absent from every CI checkout, and no lint job generates the
      # bindings first, so in CI this entry matches nothing. It earns its
      # keep only for a developer running mage lint after building the
      # bindings locally. The consequence is the entry's subject: a local
      # lint red and a local lint green are both claims about the local
      # tree, not about the gate.
      - adk/python/gapi/native
