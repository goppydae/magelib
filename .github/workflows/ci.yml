name: Continuous Integration

# magelib is the shared build library both code repos vendor. Until this
# workflow existed the library's own tests ran nowhere automatically: a
# defect in the lint gate, the doctor checks, or the terminology rules
# reached gapi and goblin through a tag, and the first thing to notice
# was a consumer's red build. See MAGELIB-DIV-001.
#
# Unlike the consumer repos this needs no sibling checkouts and no
# GOWORK setting: magelib carries no go.work and no vendor directory, so
# a lone clone is already the only resolution mode it has.
#
# Every target runs under mage -v so the log names each dependency as it
# fires. Without it the run is silent about checkHermetic having gated
# anything, exactly as `go test` without -v is silent about how many
# tests ran. This makes the wiring visible, not enforced: nothing
# asserts on the line, so deleting an mg.Deps still goes green. That
# residual is recorded in MAGELIB-DIV-001.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Compile
        run: nix develop -c mage -v build

      # mage test runs with -race, which needs cgo; the flake carries gcc
      # for exactly this reason.
      - name: Execute Tests
        run: nix develop -c mage -v test

  ecosystem-gates:
    name: Ecosystem Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # --all-systems is load-bearing, not thoroughness. A plain
      # `nix flake check` PASSES on a flake that cannot evaluate for
      # darwin at all: it omits the incompatible systems, says so in a
      # warning, and exits 0. So the only operation that can catch a
      # flake reverting to eachDefaultSystem - which re-enumerates the
      # x86_64-darwin that nixpkgs 26.11 dropped - is this one. Runs
      # ahead of doctor because it is upstream of the toolchain: it
      # evaluates the shells rather than entering one. See
      # MAGELIB-DIV-005.
      - name: Evaluate the Flake for Every Declared System
        run: nix flake check --all-systems

      # Doctor next: a gate that runs against an unverified toolchain
      # reports on the wrong machine. It reads GOBIN from the shellHook
      # and asserts the shared tools resolve into the pinned store.
      - name: Validate the Dev Shell
        run: nix develop -c mage -v doctor

      # magelib's Lint carries a documented G204/G304 carve-out that the
      # consumer repos do not get. See the comment on Lint in Magefile.go.
      - name: Lint Gate
        run: nix develop -c mage -v lint

  # MAGELIB-DIV-008. magelib ships three files that cross the repo
  # boundary UNTAGGED and UNVENDORED, and until this job nothing on this
  # side gated them:
  #
  #   .golangci.yml   pkg/magelib/lint.go:24 searches "." then
  #                   "../magelib/", so both consumers lint against
  #                   whatever this repo's main holds
  #   flake.nix       the devShell mage envcheck compares across all
  #                   three shells
  #   the pins        mage doctor validates against the shell
  #
  # Both consumers check magelib out with NO ref - main - on every one of
  # their own CI runs. So a change here could only be discovered by them,
  # after merge, attributed to whatever they happened to be changing.
  #
  # This is deliberately NOT a repository_dispatch to the consumers. A
  # dispatch fires after merge and reports damage already done; this runs
  # on the pull request, before. It also exercises the actual change,
  # which a dispatch to a repo that vendors magelib by TAG cannot - see
  # GAPI-DIV-073 for what that failure mode costs when nobody notices.
  consumer-gates:
    name: Consumer Gates
    runs-on: ubuntu-latest
    env:
      # The consumers' own resolution: vendored magelib CODE paired with
      # THIS pull request's CONFIG. That pairing is the live-read surface
      # this job exists for. Building consumer Go against magelib HEAD
      # would assert a resolution no consumer uses and no release makes,
      # and each consumer already proves the vendored path itself.
      GOWORK: "off"
    steps:
      - name: Checkout Workspace (Magelib, this pull request)
        uses: actions/checkout@v4
        with:
          path: magelib

      # No token on either sibling. All three repos are public, so a
      # cross-repo checkout needs no credential - gapi and goblin still
      # pass GOPPYDAE_READ_TOKEN in their own sibling jobs, which is
      # vestigial rather than required, and that secret does not exist
      # here.
      - name: Checkout Workspace (Gapi)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi

      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          repository: goppydae/goblin
          path: goblin

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Report What Is Under Test
        run: |
          echo "magelib $(git -C magelib rev-parse --short HEAD)  (this pull request)"
          echo "gapi    $(git -C gapi rev-parse --short HEAD)"
          echo "goblin  $(git -C goblin rev-parse --short HEAD)"

      # Both consumers, because the shared config meets two different
      # rule surfaces and a change can be fine for one and not the other.
      - name: Lint Gate (Gapi, against this config)
        working-directory: gapi
        run: nix develop -c mage -v lint

      - name: Lint Gate (Goblin, against this config)
        working-directory: goblin
        run: nix develop -c mage -v lint

      # envcheck compares all three shells, so one vantage covers the
      # set; running it from each consumer would repeat the same
      # comparison rather than widen it. doctor is per-shell and is
      # already run against magelib's own in ecosystem-gates, so this is
      # a consumer's view of the same pins.
      - name: Detect Tool Skew Across Sibling Shells
        working-directory: gapi
        run: nix develop -c mage -v envcheck

      - name: Validate Consumer Dev Shell Against These Pins
        working-directory: gapi
        run: nix develop -c mage -v doctor

      - name: Name What This Failure Means
        if: failure()
        run: |
          echo "::error::A consumer's gate rejects this pull request's shared configuration."
          echo "::error::magelib's own build and tests may be perfectly green - this is the"
          echo "::error::live-read surface (.golangci.yml, flake.nix devShell, the pins),"
          echo "::error::which gapi and goblin read from THIS repo's main with no tag and no"
          echo "::error::vendoring. Merging would redden both consumers on their next run."
